name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  conventional-commit:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      # Every merge is a squash whose commit title is the PR title, and
      # semantic-release reads those titles to pick the next version. A title
      # that does not follow Conventional Commits is invisible to it.
      - name: Check title
        env:
          # Passed through the environment, never interpolated into the
          # script: a PR title is attacker-controlled text.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix: handle empty prompts' or 'feat(image)!: drop the count parameter'. Got: $TITLE"
            exit 1
          fi
