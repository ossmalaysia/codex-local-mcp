name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional here: the spawn, quoting and process-tree
        # handling in src/codex.ts is platform-specific and has broken before.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fail on moderate or worse vulnerabilities
        run: npm audit --audit-level=moderate

  windows-installer:
    name: Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build a test installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version 0.0.1
      - name: Install, verify, and uninstall
        shell: pwsh
        run: ./scripts/test-windows-setup.ps1 -Version 0.0.1
      - name: Test Cloudflare setup security
        shell: pwsh
        run: powershell.exe -NoProfile -File installer/windows/test-cloudflare.ps1 -Executable artifacts/windows-0.0.1/payload/CodexMCP.exe
      - name: Test saved account and address states
        shell: pwsh
        run: powershell.exe -NoProfile -STA -File installer/windows/test-accounts.ps1 -Executable artifacts/windows-0.0.1/payload/CodexMCP.exe
