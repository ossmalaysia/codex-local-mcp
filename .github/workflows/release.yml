name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never run two releases at once; a second push waits for the first to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the GitHub Release
      issues: write # open an issue if a release fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the next version is computed from every
          # commit since the last release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build and test the exact commit being released
        run: |
          npm run build
          npm test

      # Releases are tags plus GitHub Releases only. Nothing is committed back:
      # main is protected, and the workflow token deliberately cannot bypass it.
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
