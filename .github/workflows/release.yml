name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable Windows update version (for example 0.4.2)
        required: true
        type: string

permissions:
  contents: read

# Never run two releases at once; a second push waits for the first to finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
      tag: ${{ steps.release.outputs.tag || steps.manual.outputs.tag }}
    permissions:
      contents: write # create the tag and the GitHub Release
      issues: write # open an issue if a release fails
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the next version is computed from every
          # commit since the last release tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

      - name: Build and test the exact commit being released
        run: |
          npm run build
          npm test

      # Releases are tags plus GitHub Releases only. Nothing is committed back:
      # main is protected, and the workflow token deliberately cannot bypass it.
      - name: Release
        id: release
        if: github.event_name == 'push'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare a versioned Windows update
        id: manual
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$UPDATE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$UPDATE_VERSION" -f "sha=$GITHUB_SHA"
          gh release create "v$UPDATE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "v$UPDATE_VERSION"
          echo "version=$UPDATE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$UPDATE_VERSION" >> "$GITHUB_OUTPUT"

  windows-installer:
    name: Windows x64 installer
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup show
      - name: Build versioned installer from the release tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          WINDOWS_UPDATE_SIGNING_KEY: ${{ secrets.WINDOWS_UPDATE_SIGNING_KEY }}
        run: ./scripts/build-native-desktop.ps1 -Version $env:RELEASE_VERSION -Release
      - name: Install, verify, and uninstall the setup executable
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: ./scripts/test-windows-setup.ps1 -Version $env:RELEASE_VERSION
      - name: Test native OAuth, sandbox contract, and desktop UI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          cargo test --locked --all-targets
          cargo build --locked --examples
          node node_modules/playwright/cli.js install chromium
          node scripts/test-native.mjs --service "artifacts/native-desktop-$env:RELEASE_VERSION/payload/runtime/codex-mcp-service.exe"
          node scripts/test-desktop-ui.mjs
      - name: Attach installer and SHA256 to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload $env:RELEASE_TAG "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-windows-x64-setup.exe" "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-windows-x64-setup.exe.sha256" "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-windows-x64.zip" "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-windows-x64.zip.sha256" "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-native-windows-x64.zip" "artifacts/CodexLocalMCP-$env:RELEASE_VERSION-native-windows-x64.zip.sha256" "artifacts/update.json" "artifacts/update.json.minisig" --clobber
      - name: Publish the verified Windows update
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
